version: "3.9"

networks:
  nl2sql-net:
    driver: bridge

volumes:
  qdrant_storage:
  postgres_data:

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: nl2sql-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app/logs:/app/app/logs
    networks:
      - nl2sql-net

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: nl2sql-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_BASE=http://backend:8000
    networks:
      - nl2sql-net
    depends_on:
      - backend

  # ── Qdrant Vector Database ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: nl2sql-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - nl2sql-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Postgres Metadata Store ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nl2sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-nl2sql_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nl2sql-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-nl2sql_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
